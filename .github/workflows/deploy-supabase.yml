name: Deploy Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in             SUPABASE_ACCESS_TOKEN             SUPABASE_DB_PASSWORD             SUPABASE_PROJECT_REF             SUPABASE_POOLER_HOST             SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID             SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Build IPv4 session-pooler URL
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))
          PY
          )"
          echo "::add-mask::$ENCODED_PASSWORD"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Preview database migrations
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Apply Auth configuration
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF"

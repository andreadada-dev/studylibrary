name: Deploy Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, coolify]
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            SUPABASE_POOLER_HOST \
            SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID \
            SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Build IPv4 session-pooler URL
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_PASSWORD="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))
          PY
          )"
          echo "::add-mask::$ENCODED_PASSWORD"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Preview database migrations
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Migration attempt $attempt/5"

            set +e
            output="$(supabase db push --db-url "$SUPABASE_DB_URL" 2>&1)"
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # Retry only genuinely transient database/network failures.
            # SQL syntax/schema errors must fail immediately instead of wasting 5 attempts.
            if ! printf '%s\n' "$output" | grep -Eqi               'deadlock detected|SQLSTATE 40P01|connection (reset|refused|closed)|server closed the connection unexpectedly|timeout|timed out|temporary failure'; then
              echo "::error::Non-transient migration failure. Fix the SQL before rerunning."
              exit "$status"
            fi

            if [ "$attempt" -eq 5 ]; then
              exit "$status"
            fi

            wait_seconds=$((attempt * 5))
            echo "Transient migration failure, retrying in ${wait_seconds}s..."
            sleep "$wait_seconds"
          done

      - name: Apply Auth configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]

          payload = {
              "site_url": "https://study.ddone.it",
              "uri_allow_list": "https://study.ddone.it,https://study.ddone.it/",
              "external_google_enabled": True,
              "external_google_client_id": os.environ["SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID"],
              "external_google_secret": os.environ["SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET"],
              "external_google_skip_nonce_check": False,
          }

          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project_ref}/config/auth",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="PATCH",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status < 200 or response.status >= 300:
                      raise RuntimeError(f"Unexpected HTTP status {response.status}")
                  print("Supabase Auth configuration updated.")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Supabase Auth config failed: HTTP {error.code}: {body}")
          PY

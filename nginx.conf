server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Self-describing protocol for AI/agents. Static and versioned with the app.
  location = /api/v1/agent {
    default_type application/json;
    alias /usr/share/nginx/html/protocol/agent.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location = /.well-known/studylibrary.json {
    default_type application/json;
    alias /usr/share/nginx/html/protocol/agent.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location ~ ^/api/v1/schema/(catalog|lesson|topic|update-package)$ {
    default_type application/schema+json;
    alias /usr/share/nginx/html/protocol/schemas/$1.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Per-catalog agent metadata and quality audit.
  location ~ ^/api/v1/catalogs/([^/]+)/agent$ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      return 204;
    }
    if ($request_method != GET) { return 405; }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_pass __SUPABASE_URL__/rest/v1/rpc/studylibrary_catalog_agent?catalog_key=$1;
  }

  location ~ ^/api/v1/catalogs/([^/]+)/audit$ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      return 204;
    }
    if ($request_method != GET) { return 405; }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_pass __SUPABASE_URL__/rest/v1/rpc/studylibrary_catalog_audit?catalog_key=$1;
  }

  # Public read-only knowledge API. Nginx injects the public Supabase key;
  # PostgreSQL decides which catalog/library/lesson/topic is API-readable.
  location = /api/v1 {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      return 204;
    }
    if ($request_method != GET) { return 405; }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_pass __SUPABASE_URL__/rest/v1/rpc/studylibrary_api?path=;
  }

  # Authenticated full-catalog write endpoint with optimistic concurrency.
  # Client must send its Supabase access token as Authorization: Bearer <jwt>.
  location = /api/v1/write {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      return 204;
    }
    if ($request_method != POST) { return 405; }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type "application/json";
    proxy_ssl_server_name on;
    proxy_pass __SUPABASE_URL__/rest/v1/rpc/studylibrary_api_write;
  }

  location ~ ^/api/v1/(.*)$ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      return 204;
    }
    if ($request_method != GET) { return 405; }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    proxy_set_header apikey "__SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_PUBLISHABLE_KEY__";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_pass __SUPABASE_URL__/rest/v1/rpc/studylibrary_api?path=$1;
  }

  location ~* \.(?:css|js|json|webmanifest|xml|txt)$ {
    expires -1;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
